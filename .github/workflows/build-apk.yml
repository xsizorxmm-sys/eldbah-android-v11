name: Build Eldbah Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install مؤسسة الدبّاح launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode branding/launcher-logo.jpg.b64 > app/src/main/res/drawable-nodpi/ic_launcher_logo.jpg
          file app/src/main/res/drawable-nodpi/ic_launcher_logo.jpg
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: eldbah-v11-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare private release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ELDBAH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ELDBAH_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELDBAH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELDBAH_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/eldbah-upload-key.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ELDBAH_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ELDBAH_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ELDBAH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ELDBAH_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "release_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; skipping signed release."
          fi
      - name: Build signed release APK and App Bundle
        if: steps.signing.outputs.release_ready == 'true'
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Upload signed release APK and AAB
        if: steps.signing.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eldbah-v11-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
