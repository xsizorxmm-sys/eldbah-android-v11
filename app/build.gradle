plugins { id 'com.android.application' }

android {
    namespace 'com.eldbah.store'
    compileSdk 35
    defaultConfig {
        applicationId 'com.eldbah.store'
        minSdk 23
        targetSdk 35
        versionCode 10
        versionName '2.8'
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            // Configure signing only from private GitHub Actions Secrets.
        }
    }
}
