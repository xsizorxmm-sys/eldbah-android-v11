plugins { id 'com.android.application' }

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

def releaseStorePath = System.getenv("ELDBAH_STORE_FILE")

android {
    namespace 'com.eldbah.store'
    compileSdk 35
    defaultConfig {
        applicationId 'com.eldbah.store'
        minSdk 23
        targetSdk 35
        versionCode 11
        versionName '2.9'
    }
    signingConfigs {
        release {
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
                storePassword System.getenv("ELDBAH_STORE_PASSWORD")
                keyAlias System.getenv("ELDBAH_KEY_ALIAS")
                keyPassword System.getenv("ELDBAH_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            // Signing is enabled only when private GitHub Actions secrets are present.
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}
